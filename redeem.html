<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禮券兌換 - P_POC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b">
    <div class="max-w-2xl mx-auto px-4 py-4">
      <h1 class="text-lg font-bold text-indigo-700">P_POC 獎勵兌換</h1>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-10">

    <div id="loading" class="flex justify-center py-20">
      <div class="spinner"></div>
    </div>

    <section id="loginSection" class="hidden text-center">
      <p class="text-gray-600 mb-4">請先登入以查詢兌換狀態</p>
      <button id="loginBtn" class="inline-flex items-center gap-2 bg-white border border-gray-300 shadow-sm px-6 py-3 rounded-lg hover:bg-gray-50">
        使用 Google 帳號登入
      </button>
    </section>

    <section id="blockedSection" class="hidden bg-white rounded-xl shadow-sm border p-8 text-center">
      <p id="blockedMessage" class="text-gray-700"></p>
      <a href="./index.html" class="inline-block mt-4 text-indigo-600 hover:underline text-sm">回首頁</a>
    </section>

    <section id="rewardSection" class="hidden bg-white rounded-xl shadow-sm border p-8 text-center">
      <p class="text-gray-500 text-sm mb-4">請至超商門市出示以下條碼供店員刷讀兌換</p>
      <div class="flex justify-center mb-4">
        <svg id="barcodeSvg"></svg>
      </div>
      <p id="serialText" class="text-xl font-mono font-semibold tracking-widest text-gray-800"></p>
      <p id="rewardError" class="hidden text-sm text-red-600 mt-4"></p>
    </section>

  </main>

  <script type="module" src="./assets/js/redeem.js"></script>
</body>
</html>
